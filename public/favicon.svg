<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2f8f82"/>
      <stop offset="100%" stop-color="#1f6b60"/>
    </linearGradient>
  </defs>

  <!-- backdrop -->
  <rect x="0" y="0" width="64" height="64" rx="16" fill="url(#bg)"/>

  <!-- capsule / pill, rotated 45 degrees -->
  <g transform="rotate(45 32 32)">
    <rect x="14" y="22" width="36" height="20" rx="10" fill="#fbfdfc"/>
    <rect x="14" y="22" width="18" height="20" rx="10" fill="#8fe9d4"/>
    <line x1="32" y1="23" x2="32" y2="41" stroke="#1f6b60" stroke-width="1.5"/>
  </g>
</svg>
